#### Device Config File ####

#************************************************
# DEVICE NAME

#This field is a name, which identifies the device
#uniquely. Can be a hostname such as: host1.abc.com
#
#Events that doesn't have this field, will be 
#identified by "dvc" field.
#If both fields are present in an event, dvchost
#will be used.

dvchost=

#************************************************
# DEVICE ID

#Contains the device IP address. This field is used 
#to identify the device uniquely. i.e. 172.16.0.1
#
#Events that doesn't have this field, will be 
#identified by "dvchost" field.

dvc=

#************************************************
# DEFAULT EVENTS FORMAT

# CEF=cef, Syslog=sys, CSV=csv, JSON=jsn

log_format=

#************************************************
# TIMESTAMP MECHANISM

# The field name containing the event's timestamp.
# For example, CEF default is "rt".

timestamp=

