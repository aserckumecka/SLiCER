d
#************************************************
HEADER

#version      		#Version of CEF format
#devvendor     	#Device Vendor
#devproduct    	#Device Product
#devversion    	#Device version
#deveventclid  	#Device Event Class ID (unique identifier)
#eventname    		#Description of the event
#severity      		#Can be a string: Unknown, Low, Medium, High, and Very-High; or an
                		# integer (0-3=Low, 4-6=Medium, 7-8=High, and 9-10=Very-High)

#************************************************
EXTENSIONS (CEFKeyName                 FullName/description)

