#### SLiCER Config File ####

#************************************************
# BLOCK OF EVENTS

# Maximum period of time to create a block. In minutes.

interval=10

# Maximum size for a raw event block. In megabytes.

size=5

#************************************************
# BUFFER SIZE

# The limit of events stored in memory before
# writing them to disk.

buffer=300

#************************************************
# INCOMING EVENTS

# IP and Port where SLiCER waits for new Events.

ip=10.10.5.69
port=8888

#************************************************
# FEEDING SLICER USING A DATASET

# To feed SLiCER using stored events, set the path.

evtsource=dataset/logs

#************************************************
# DEFAULT COMPRESSION FORMAT

# XZ=tar.xz

compress=tar.xz

#************************************************
# DEFAULT INDEXER

# lucene full=lf, lucene reduced=lr, bloom filter=bf

indexer=lr

#************************************************
# DOWNLOAD COST
# Set the estimated cost for each gigabyte downloaded.
# Prices can be an average of used providers prices 
# or can be obtained as a reference from:
# https://aws.amazon.com/s3/pricing/  at
# "Data transfer pricing"
# "Data Transfer OUT From Amazon S3 To Internet"

cost=0.09
